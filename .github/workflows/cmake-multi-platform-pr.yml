name: CMake on multiple platforms via pull request

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release
            archive_name: SpikeLibraries-Linux-x64.tar.gz
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release
            archive_name: SpikeLibraries-Linux-Clang.tar.gz

          # Linux ARM64
          - os: ubuntu-24.04-arm
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release
            archive_name: SpikeLibraries-Linux-ARM64.tar.gz

          # Windows x64
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            build_type: Release
            archive_name: SpikeLibraries-Windows-x64.zip

          # macOS Apple Silicon (ARM64)
          - os: macos-15
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release
            archive_name: SpikeLibraries-macOS-15-arm64.tar.gz
          
          - os: macos-26
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release
            archive_name: SpikeLibraries-macOS-26-arm64.tar.gz

    steps:
    - uses: actions/checkout@v4

    # Install ccache on Unix platforms
    - name: Install ccache (Unix)
      if: runner.os != 'Windows'
      run: |
        if command -v apt-get &> /dev/null; then
          sudo apt-get update && sudo apt-get install -y ccache
        elif command -v brew &> /dev/null; then
          brew install ccache
        fi

    # Install ccache on Windows via Chocolatey
    - name: Install ccache (Windows)
      if: runner.os == 'Windows'
      run: choco install ccache -y

    # Setup ccache caching across matrix jobs
    - name: Cache ccache files
      uses: actions/cache@v4
      with:
        path: |
          ~/.ccache
          ${{ github.workspace }}/.ccache
        key: ccache-${{ matrix.os }}-${{ matrix.c_compiler }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ matrix.os }}-${{ matrix.c_compiler }}-

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_C_COMPILER_LAUNCHER=ccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config ${{ matrix.build_type }}