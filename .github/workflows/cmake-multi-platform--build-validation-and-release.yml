name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release
            archive_name: SpikeLibraries-Linux-gcc-x64.tar.gz
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release
            archive_name: SpikeLibraries-Linux-clang-x64.tar.gz

          # Linux ARM64
          - os: ubuntu-24.04-arm
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release
            archive_name: SpikeLibraries-Linux-gcc-arm64.tar.gz

          # Windows x64
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            build_type: Release
            archive_name: SpikeLibraries-Windows-x64.zip

          # Windows ARM64
          - os: windows-11-arm
            c_compiler: cl
            cpp_compiler: cl
            build_type: Release
            archive_name: SpikeLibraries-Windows-arm64.zip

          # macOS ARM64
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release
            archive_name: SpikeLibraries-macOS-clang-arm64.tar.gz
          - os: macos-26-intel
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release
            archive_name: SpikeLibraries-macOS-intel-clang-arm64.tar.gz

    steps:
    - uses: actions/checkout@v4

    # Install ccache on Unix platforms
    - name: Install ccache (Unix)
      if: runner.os != 'Windows'
      run: |
        if command -v apt-get &> /dev/null; then
          sudo apt-get update && sudo apt-get install -y ccache
        elif command -v brew &> /dev/null; then
          brew install ccache
        fi

    # Install ccache on Windows via Chocolatey
    - name: Install ccache (Windows)
      if: runner.os == 'Windows'
      run: choco install ccache -y

    # Setup ccache caching across matrix jobs
    - name: Cache ccache files
      uses: actions/cache@v4
      with:
        path: |
          ~/.ccache
          ${{ github.workspace }}/.ccache
        key: ccache-${{ matrix.os }}-${{ matrix.c_compiler }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ matrix.os }}-${{ matrix.c_compiler }}-

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_C_COMPILER_LAUNCHER=ccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config ${{ matrix.build_type }}

    # Package Binaries into Archives
    # Stage and Package (Unix)
    - name: Stage and Package Binaries (Unix)
      if: runner.os != 'Windows'
      run: |
        mkdir -p dist/bin
        mkdir -p dist/include
        
        # Copy compiled binaries from build/bin/<CONFIG> and headers
        cp -r ${{ steps.strings.outputs.build-output-dir }}/bin/${{ matrix.build_type }}/* dist/bin/
        cp -r include/* dist/include/
        
        # Copy root metadata files if they exist
        if [ -f "LICENSE" ]; then cp LICENSE dist/; fi
        if [ -f "README.md" ]; then cp README.md dist/; fi
        
        # Create tar.gz archive from the staging folder
        tar -czvf ${{ matrix.archive_name }} -C dist .

    # Stage and Package (Windows)
    - name: Stage and Package Binaries (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $binDir = "${{ steps.strings.outputs.build-output-dir }}/bin/${{ matrix.build_type }}"
        if (-Not (Test-Path $binDir)) { $binDir = "${{ steps.strings.outputs.build-output-dir }}/bin" }
        
        New-Item -ItemType Directory -Force -Path "dist/bin" | Out-Null
        New-Item -ItemType Directory -Force -Path "dist/include" | Out-Null
        
        Copy-Item -Path "$binDir\*" -Destination "dist/bin" -Recurse -Force
        Copy-Item -Path "include\*" -Destination "dist/include" -Recurse -Force
        
        # Copy root metadata files if they exist
        if (Test-Path "LICENSE") { Copy-Item "LICENSE" -Destination "dist\" }
        if (Test-Path "README.md") { Copy-Item "README.md" -Destination "dist\" }
        
        Compress-Archive -Path "dist\*" -DestinationPath "${{ matrix.archive_name }}" -Force

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: artifact-${{ matrix.archive_name }}
        path: ${{ matrix.archive_name }}

  # Automated GitHub Release Job
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          merge-multiple: true

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: downloaded-artifacts/*
          body_path: docs/CHANGELOG.md
          prerelease: ${{ contains(github.ref, '-') }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
# to trigger a release - need to push new version tag
# git tag v1.0.0
# git push origin v1.0.0

# git push --delete origin v1.0.0
# git tag --delete v1.0.0
