name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release
            archive_name: SpikeLibraries-Linux-x64.tar.gz
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release
            archive_name: SpikeLibraries-Linux-Clang.tar.gz

          # Linux ARM64
          - os: ubuntu-24.04-arm
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release
            archive_name: SpikeLibraries-Linux-ARM64.tar.gz

          # Windows x64
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            build_type: Release
            archive_name: SpikeLibraries-Windows-x64.zip

          # Windows ARM64
          - os: windows-11-arm
            c_compiler: cl
            cpp_compiler: cl
            build_type: Release
            archive_name: SpikeLibraries-Windows-ARM64.zip

          # macOS ARM64
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release
            archive_name: SpikeLibraries-macOS-arm64.tar.gz
          - os: macos-26-intel
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release
            archive_name: SpikeLibraries-macOS-intel-arm64.tar.gz

    steps:
    - uses: actions/checkout@v4

    # Install ccache on Unix platforms
    - name: Install ccache (Unix)
      if: runner.os != 'Windows'
      run: |
        if command -v apt-get &> /dev/null; then
          sudo apt-get update && sudo apt-get install -y ccache
        elif command -v brew &> /dev/null; then
          brew install ccache
        fi

    # Install ccache on Windows via Chocolatey
    - name: Install ccache (Windows)
      if: runner.os == 'Windows'
      run: choco install ccache -y

    # Setup ccache caching across matrix jobs
    - name: Cache ccache files
      uses: actions/cache@v4
      with:
        path: |
          ~/.ccache
          ${{ github.workspace }}/.ccache
        key: ccache-${{ matrix.os }}-${{ matrix.c_compiler }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ matrix.os }}-${{ matrix.c_compiler }}-

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_C_COMPILER_LAUNCHER=ccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config ${{ matrix.build_type }}

    # Package Binaries into Archives
    - name: Package Binaries (Unix tar.gz)
      if: runner.os != 'Windows'
      run: |
        tar --exclude='./_deps' -czvf ${{ matrix.archive_name }} -C ${{ steps.strings.outputs.build-output-dir }} .

    - name: Package Binaries (Windows .zip)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $buildDir = "${{ steps.strings.outputs.build-output-dir }}"
        $stageDir = "staging-binaries"
        New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
        
        Get-ChildItem -Path $buildDir -Exclude "_deps" | Copy-Item -Destination $stageDir -Recurse -Force
        
        $targetDir = "$stageDir\${{ matrix.build_type }}"
        if (-Not (Test-Path $targetDir)) { $targetDir = $stageDir }
        
        Compress-Archive -Path "$targetDir\*" -DestinationPath "${{ matrix.archive_name }}" -Force

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: artifact-${{ matrix.archive_name }}
        path: ${{ matrix.archive_name }}

  # Automated GitHub Release Job
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          merge-multiple: true

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: downloaded-artifacts/*
          body_path: docs/CHANGELOG.md
          prerelease: ${{ contains(github.ref, '-') }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
# to trigger a release - need to push new version tag
# git tag v1.0.0
# git push origin v1.0.0

# git push --delete origin v1.0.0
# git tag --delete v1.0.0
